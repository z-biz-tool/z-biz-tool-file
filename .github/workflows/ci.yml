name: CI

# Build & Release 只在打 tag 时跑，测试从来没有门禁；
# 这里对每次 push / PR 做前端构建 + 前后端测试。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # cap-llm / cap-doc 走 ../../z-biz-tool-capability path 依赖；runner 上只有本仓，
      # 把公共能力仓取到 workspace 内，再链接到 src-tauri 的同级目录。
      - name: Checkout capability (path deps)
        uses: actions/checkout@v4
        with:
          repository: z-biz-tool/z-biz-tool-capability
          path: .capability

      - name: Link capability (Unix)
        if: runner.os != 'Windows'
        run: ln -sfn "$GITHUB_WORKSPACE/.capability" "$GITHUB_WORKSPACE/../z-biz-tool-capability"

      - name: Link capability (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\..\z-biz-tool-capability" -Target "$env:GITHUB_WORKSPACE\.capability" | Out-Null

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # 同 Build & Release：GitHub 新 token 会写坏 dtolnay 生成的 cargo config
      - name: Reset broken cargo config
        run: rm -f "$HOME/.cargo/config.toml"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      # typecheck 之前一直是红的（35~47 条），所以只能不跑；本轮清到 0 之后把它变成门禁，
      # 否则下次再有人往 string[] 里塞 FileEntry[] 这类事只有真机点进去才发现。
      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Frontend tests
        run: npm test

      # tauri::generate_context! 读取 build.frontendDist=../dist，必须先有 dist/
      - name: Rust tests
        working-directory: src-tauri
        # `-- --nocapture`：Rust 测试框架默认**吞掉通过用例的 stdout/stderr**
        # ⇒ 本仓「[LIVE] 跳过 minimax 真实 API 实测…」这类跳过标记在 CI 日志里
        # 看不见 ⇒ 「没跑」看着跟「跑过了」一样。打开捕获后可核对。
        run: cargo test -- --nocapture

      # 2026-10-21 新增：静态门此前**一条都没有**（本仓 CI 只跑 typecheck/build/测试），
      # 而本地实测 `cargo clippy --all-targets -- -D warnings` 有 42 条、
      # `cargo fmt --all --check` 有 475 处差异 ——
      # 「静态门红了但 CI 不跑那个门 ⇒ 没人看见」（家族 R12）。
      # 债已在同一次提交里清零：clippy 的 42 条逐条修（自动修 23 条 + 手工 19 条），
      # fmt 475 处整仓重排。纯行为改动只有三处，都单独说明过：
      # ① 读目录的 `if let Ok(entry)` → `entries.flatten()`（行为相同）；
      # ② markdown 转换器的 `starts_with` + `&s[n..]` → `strip_prefix`（切片长度不再靠人工对齐）；
      # ③ archive 策略枚举的变体 `Overwrite` → `Replace`（**序列化名仍为 "overwrite"**，IPC 契约不变）。
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --all --check
