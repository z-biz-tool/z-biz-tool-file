[package]
name = "z-biz-tool-file"
version = "0.2.2"
description = "万能文件管理器"
edition = "2021"
license = "MIT"

[lib]
name = "z_biz_tool_file_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 家族统一深链协议（cap-hub）：zbiz:// 的构造、解析、待处理队列与产品清单。
cap-hub = { path = "../../z-biz-tool-capability/crates/cap-hub", version = "0.1.0", features = ["tauri"] }
# ── 思维导图板块（2026-11-08 从 z-biz-tool-mind 搬入）专属依赖 ──
# cap-sso：SSO 回环回调服务器 + 开浏览器 + OS 密钥库；协议在 z-biz-tool-shared/sso。
cap-sso = { path = "../../z-biz-tool-capability/crates/cap-sso", version = "0.1.0", features = ["tauri"] }
# cap-sso 的 tauri feature 借官方 opener 插件开 OAuth 授权页（shell::open 已 deprecated）。
tauri-plugin-opener = "~2.5.5"
# 会员许可验签：客户端只内置公钥，私钥留在签发侧（lead/scripts/issue-license.mjs）。
ed25519-dalek = "2.1.1"
tauri = { version = "2", features = ["protocol-asset"] }
# 文档解析原语（GAP-06 文档一片）：PDF / EPUB / MOBI。
# 版本与实现统一收口到 z-biz-tool-capability/crates/cap-doc，
# 本仓只保留命令层（守卫 + 线程调度），见 src/doc_cmd.rs。
cap-doc = { path = "../../z-biz-tool-capability/crates/cap-doc", version = "0.1.0" }
# 统一 AI 接入层（2026-10-26）：原本本仓自带一套 llm_endpoint/chat_request_body/
# parse_response/call_llm，与 aigen/pet/db/note/kb 里的同类代码是同一件事的第六次重写。
# 现在协议与传输全在 cap-llm，本仓只留提示词与结果结构。见 src/ai.rs 头部。
cap-llm = { path = "../../z-biz-tool-capability/crates/cap-llm", version = "0.1.0" }
# 家族统一 LLM 配置落点（2026-11-01）：~/.z-biz-tool/llm/config.json + OS 密钥库。
# 本仓原明文 llm.json 由启动迁移器搬入并抹掉密钥。
cap-llm-config = { path = "../../z-biz-tool-capability/crates/cap-llm-config", version = "0.1.0" }
# 通用词库能力层（2026-11-08）：kb 作为通用板块收口到 cap-glossary，
# file 词库板块用它做词条存取 + 切片检索 + 问答拼装（与 note 同一套逻辑）。
cap-glossary = { path = "../../z-biz-tool-capability/crates/cap-glossary", version = "0.1.0" }
# 哈希原语（cap-hash）：CRC-32 的实现与查表收口到能力层，
# 本仓只留「打开文件 + 流式喂字节」的编排（mind 仓有同一份 CRC-32 的 TS 抄本）。
# 2026-11-01 起走 crates.io 正式版（0.1.0 已发布，名字已占住）：
# path 依赖只在本地能编，发出去的包在别人机器上装不上。
cap-hash = "0.1.0"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
# reqwest 已随 AI 接入层迁入 cap-llm（本仓 src/ 中不再出现 reqwest）
ssh2 = "0.9"
# terminal 板块的 ssh/pty/端口转发是 tokio 重用户（sync / time / net / process 都要），
# 原来只开 rt-multi-thread + macros 是够 file 自己用的，搬入后必须放到 full。
tokio = { version = "1", features = ["full"] }
walkdir = "2"
notify = "6"
epub = "2"
html2text = "0.12"
regex-lite = "0.1"
image = "0.25"
uuid = { version = "1", features = ["v4"] }
opener = "0.7"
md-5 = "0.10"
sha1 = "0.10"
regex = "1"

# 矩阵规划 03 §8 第 2 步：基础图片处理委托给 z-biz-tool-capability。
# cap-img 内部打包了 image + base64，因此本仓 image/base64 中：
#   - image 仍保留（pdf_image.rs 等模块还要用）
#   - base64 已删除（只有 image_utils.rs 用，已搬走）
# 2026-09-25 起走 crates.io 正式版（0.1.0 已发布），不再 pin git tag
#
# 2026-10-21 升到 0.3.0：本仓是**家族里唯一用到变换族**的（thumbnail / resize /
# rotate / flip / crop / apply_filter / export / info），而 0.3.0 修掉了三条
# 只在这条路上可达的缺陷：
#   1. crop 的 `x + w` u32 溢出 —— debug 直接 panic，release 回绕成小值
#      ⇒ **越界检查被绕过**。而本仓 `crop_image` 命令把前端传的 x/y/w/h
#      原样透传 ⇒ 外部输入直达。
#   2. EXIF 的 IFD0 只比了起点、没比要读的区间 ⇒ `data[off..off+2]` 切片 panic，
#      **任何人都能手搓一个 JPEG 触发**；`get_image_info` 直接调 `cap_img::info`。
#   3. 「名字说谎」的文件 —— 变换族按源图扩展名决定输出格式、export 按参数决定，
#      两者都不看目标扩展名 ⇒ 写出的 .jpg 里其实是 PNG 字节。
# 0.x 语义下 minor 即 breaking，且 crates.io 不可覆盖 ⇒ 只能走 0.3.0。
#
# 0.4.0：EXIF 全量读写进能力层 —— 本仓私藏的 image_exif.rs 解析器退役，
# 只保留「平铺成 ExifInfo 给预览面板」的展示映射。kamadak-exif 随之删依赖。
cap-img = "0.4.0"
sha2 = "0.10"
# chrono 需要 serde feature —— 数据库板块的查询结果里日期时间要能序列化给前端。
# 2026-11-06 数据库板块并入时补上（db 仓原本就是带 serde feature 的）。
chrono = { version = "0.4", features = ["serde"] }


ureq = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
# 更新安装后的「立即重启」：terminal 前端 UpdaterGate 用到 process 插件
tauri-plugin-process = "2"
# ── 系统板块（2026-11-06 从 z-biz-tool-sys 搬入）用到的依赖 ──
# sysinfo: CPU/内存/磁盘/网络的采集源；libc: macOS 上的 sysctl / proc_pidpath 等原生调用；
# notification: 告警要发系统通知。注意 capabilities **必须**给 notification:default ——
# 插件会往 webview 注入启动脚本，页面加载就调 plugin:notification|is_permission_granted，
# 缺这条 ACL 会以「未处理的 Promise 拒绝」整屏启动失败（2026-11-09 踩过）。
sysinfo = "0.33"
libc = "0.2"
tauri-plugin-notification = "2.4.0"
# ── AI 任务看板（2026-11-07 从 z-biz-tool-worker 搬入）用到的依赖 ──
# rusqlite: 任务/Agent 的组织数据落库（bundled 自带 SQLite，免系统库依赖）；
# reqwest: 本地 agent-proxy 的 HTTP/SSE 转发。serde/serde_json/uuid/chrono 上面已有。
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
dirs = "5"

# ─────────────────────── 终端板块（2026-11-04 从 z-biz-tool-terminal 仓搬入）──
# 注意这里的 SSH 栈和上面的 `ssh2` 是**两套并存**，不是笔误：
#   - `ssh2`（libssh2 绑定）服务于本仓原有的 sftp.rs —— 把远程目录当本地目录浏览；
#   - `russh`（纯 Rust）服务于搬进来的终端板块 —— PTY、端口转发、跳板机、sftp 双栏面板。
# 两套的会话/通道模型不同（前者同步阻塞、后者 async），强行统一会把 terminal 的
# 80KB ssh.rs 重写一遍，风险远大于收益。文件体积代价约为 +6MB。
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2.0"
ssh-key = { version = "0.6", features = ["ed25519"] }
async-trait = "0.1.92"
aes-gcm = "0.10.3"
data-encoding = "2"

# ---- 归档引擎（src/archive/）：目标是完全替掉本机的 7-Zip，所以这里全是纯 Rust/自包含实现，
# ---- 不 shell out 到 `C:\Program Files\7-Zip\7z.exe`。理由有三条：
# ----   1) 目标机器可能没装 7-Zip，装了的版本也不一样（本机是 26.03）；
# ----   2) 起子进程拿不到细粒度进度，也没法做到"逐块检查取消"；
# ----   3) 仓库里已有的外部进程 helper 全是 macOS/Linux 路径拼法，Windows 上没有先例可循。
# 各 crate 的取舍写在 archive/format.rs 的能力表里（能读的 ≠ 能写的）。
zip = { version = "9", features = ["deflate64", "lzma", "xz"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
xz2 = "0.1"
zstd = "0.14"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "frame"] }
brotli = "9"
cab = "0.6"
# RAR 只读：UnRAR 授权明确禁止写 RAR，所以没有 rar 编码器，能力表里 create=false
unrar = "0.5"
# 0.23 相对 0.6 是彻底重写（decompress(file, dest) 已不存在），API 见 archive/sevenz.rs 头注
sevenz-rust2 = "0.23"
# 解出来的文件要恢复原修改时间，否则用户按时间排序全乱了
filetime = "0.2"

# ─────────────────────── 数据库板块（2026-11-06 从 z-biz-tool-db 仓搬入）──
# db 独立 app 废弃，能力并入本仓成为第四个板块（活动栏里排在图书馆之后）。
#
# sqlx 开了四种数据库驱动：MySQL / PostgreSQL / SQLite / SQL Server。
# 体积代价明显（+约 8MB），但这是 db 能力的核心，不能砍。
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "mysql",
  "postgres",
  "sqlite",
  "chrono",
  "rust_decimal",
  "uuid",
  "json",
] }
# sqlx 自身的 fetch() 流按 try_next 消费，取够就停（该 crate 本就在 sqlx 依赖树里）
futures-util = "0.3"
rust_decimal = { version = "1", default-features = false, features = ["serde"] }
anyhow = "1"
thiserror = "1"
# db 板块的日志（连接池、查询、报表链路）
tracing = "0.1"
tracing-subscriber = "0.3"
# ⚠️ keyring 只在 Windows / Linux 上作为「显式选择的 OS 密钥库后端」使用；
# macOS 的**默认**后端是自建加密文件（cap-llm-config 的 MultiSecretFile）——
# 钥匙串 ACL 绑代码签名，本家族 adhoc 签名（cdhash 每次重打包都变）
# ⇒ 每次读数据库密码都弹授权框。详见 src/db_app/secrets/encfile.rs 头部。
keyring = "4.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
# x86_64-apple-darwin 在 arm64 runner 上交叉编译时找不到系统 OpenSSL，
# vendored 让 openssl-sys 自己编一份
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[dev-dependencies]
# lopdf 的解析/改写能力已随文档模块迁入 cap-doc，**生产代码不再直接使用**。
# 但 tests/integration_pdf_{compress,watermark}.rs 要用它构造与检查 PDF 对象，
# 因此降级为仅测试可见 —— 依赖面收窄，而不是简单删掉（删了集成测试就编不过）。
lopdf = { version = "0.34", features = ["pom_parser"] }

# ---- 体积与构建产物治理（2026-11-03 全仓统一）----
# release 关闭调试符号与增量编译：产物体积约为 debug 的 1/3~1/5，
# 且避免 incremental/ 缓存随编译会话无限累积（Tauri 家族 16 仓曾累积 80GB+）。
[profile.release]
debug = false
incremental = false
strip = "symbols"
