[package]
name = "z-biz-tool-file"
version = "0.1.0"
description = "万能文件管理器"
edition = "2021"

[lib]
name = "z_biz_tool_file_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
walkdir = "2"
notify = "6"
epub = "2"
zip = "2"
html2text = "0.12"
lopdf = "0.34"
regex-lite = "0.1"
image = "0.25"
uuid = { version = "1", features = ["v4"] }
