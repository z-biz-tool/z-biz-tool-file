[package]
name = "z-biz-tool-file"
version = "0.2.0"
description = "万能文件管理器"
edition = "2021"
license = "MIT"

[lib]
name = "z_biz_tool_file_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
ssh2 = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
kamadak-exif = "0.6"
walkdir = "2"
notify = "6"
epub = "2"
zip = "2"
tar = "0.4"
flate2 = "1"
bzip2 = "0.4"
xz2 = "0.1"
sevenz-rust = "0.6"
html2text = "0.12"
lopdf = { version = "0.34", features = ["pom_parser"] }
regex-lite = "0.1"
image = "0.25"
uuid = { version = "1", features = ["v4"] }
opener = "0.7"
md-5 = "0.10"
sha1 = "0.10"
regex = "1"

# 矩阵规划 03 §8 第 2 步：基础图片处理委托给 z-biz-tool-capability。
# cap-img 内部打包了 image + base64，因此本仓 image/base64 中：
#   - image 仍保留（pdf_image.rs 等模块还要用）
#   - base64 已删除（只有 image_utils.rs 用，已搬走）
# 2026-09-25 起走 crates.io 正式版（0.1.0 已发布），不再 pin git tag
cap-img = "0.1.0"
sha2 = "0.10"
chrono = "0.4"


ureq = "2"
tauri-plugin-updater = "2"
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
# x86_64-apple-darwin 在 arm64 runner 上交叉编译时找不到系统 OpenSSL，
# vendored 让 openssl-sys 自己编一份
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
