[package]
name = "z-biz-tool-file"version = "0.2.0"
description = "万能文件管理器"
edition = "2021"

[lib]
name = "z_biz_tool_file_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
ssh2 = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
kamadak-exif = "0.6"
walkdir = "2"
notify = "6"
epub = "2"
zip = "2"
tar = "0.4"
flate2 = "1"
bzip2 = "0.4"
xz2 = "0.1"
sevenz-rust = "0.6"
html2text = "0.12"
lopdf = "0.34"
regex-lite = "0.1"
image = "0.25"
uuid = { version = "1", features = ["v4"] }
opener = "0.7"
base64 = "0.22"
md-5 = "0.10"
sha1 = "0.10"
regex = "1"
sha2 = "0.10"
chrono = "0.4"
